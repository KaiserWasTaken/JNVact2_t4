<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar libro</title>
</head>
<body>
    <h1>Registrar libro</h1>
    <form th:action="@{/libros}" th:object="${libro}" method="post">
        <label for="titulo">Titulo:</label>
        <input id="titulo" type="text" th:field="*{titulo}" required>

        <label for="autor">Autor:</label>
        <input id="autor" type="text" th:field="*{autor}" required>

        <label for="categoria">Categoria:</label>
        <input id="categoria" type="text" th:field="*{categoria}" required>

        <label for="precio">Precio:</label>
        <input id="precio" type="number" step="0.01" min="0" th:field="*{precio}" required>

        <button type="submit">Guardar</button>
    </form>
    <p><a th:href="@{/libros}">Volver al catalogo</a></p>
</body>
</html>
